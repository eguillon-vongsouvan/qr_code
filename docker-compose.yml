services:
  qr-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/test"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
